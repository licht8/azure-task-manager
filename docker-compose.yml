services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: azure-task-manager-backend
    env_file:
      - .env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://127.0.0.1:8000
    container_name: azure-task-manager-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend