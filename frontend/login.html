<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — Task Manager</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                ✓
            </div>

            <h1>Task Manager</h1>

            <p class="auth-subtitle">
                Sign in to manage your tasks
            </p>


            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        id="username"
                        type="text"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div
                    id="loginError"
                    class="auth-error hidden"
                ></div>


                <button
                    type="submit"
                    id="loginButton"
                    class="auth-button"
                >
                    Sign In
                </button>

            </form>


            <div class="auth-footer">
                Docker Azure Demo
            </div>

        </div>

    </div>


    <script src="/static/login.js"></script>

</body>

</html>
