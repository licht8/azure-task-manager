
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - Task Manager</title>

    <link
        rel="stylesheet"
        href="/static/auth.css"
    >
	
	<link
		rel="icon"
		type="image/png"
		href="/static/logo.png"
	>

</head>


<body>

<div class="auth-container">

    <div class="auth-card">


		<div class="auth-logo">
			<img
				src="/static/logo.png"
				alt="Task Manager"
			>
		</div>

        <div class="auth-header">

            <h1>Create account</h1>

            <p>
                Start managing your tasks today
            </p>

        </div>


        <form
            id="registerForm"
            class="auth-form"
        >


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    placeholder="Enter your username"
                    minlength="3"
                    maxlength="50"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Create a password"
                    minlength="8"
                    maxlength="128"
                    autocomplete="new-password"
                    required
                >

                <span class="password-hint">
                    Minimum 8 characters
                </span>

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm password
                </label>

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Repeat your password"
                    minlength="8"
                    maxlength="128"
                    autocomplete="new-password"
                    required
                >

            </div>


            <div
                id="message"
                class="auth-message"
            ></div>


            <button
                type="submit"
                class="auth-button"
                id="registerButton"
            >
                Create account
            </button>


        </form>


        <div class="auth-link">

            Already have an account?

            <a href="/static/login.html">
                Sign in
            </a>

        </div>


    </div>

</div>


<script src="/static/register.js"></script>

</body>

</html>
