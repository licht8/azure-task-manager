name: azure-task-manager

type: Microsoft.App/containerApps

location: westeurope

properties:
  managedEnvironmentId: /subscriptions/<SUBSCRIPTION_ID>/resourceGroups/<RESOURCE_GROUP>/providers/Microsoft.App/managedEnvironments/<CONTAINER_APPS_ENVIRONMENT>

  configuration:
    activeRevisionsMode: Single

    ingress:
      external: true
      targetPort: 8000
      transport: auto

    registries:
      - server: <ACR_LOGIN_SERVER>
        identity: system

  template:
    containers:
      - name: azure-task-manager
        image: <ACR_LOGIN_SERVER>/azure-task-manager:latest

        env:
          - name: DATABASE_URL
            secretRef: database-url

        resources:
          cpu: 0.5
          memory: 1Gi

        probes:
          - type: Liveness
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30

          - type: Readiness
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10